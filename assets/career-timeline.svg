<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img"
     aria-label="Career timeline. 2023 to 2024: Software Test Engineer at Transsion Manufacturing. 2024 to 2025: System Administrator at Abronet PLC. November 2025 to now: AI Specialist and Full-Stack Developer at Droga Consultancy.">

  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <line x1="150" y1="72" x2="850" y2="72" stroke="url(#track)" stroke-width="3" stroke-linecap="round"/>

  <!-- Stage 1 -->
  <g text-anchor="middle">
    <text x="150" y="46" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1.2">2023 to 2024</text>
    <circle cx="150" cy="72" r="10" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.7"/>
    <circle cx="150" cy="72" r="4.5" fill="#94a3b8"/>
    <text x="150" y="118" font-size="16" font-weight="700" fill="#8b5cf6">Software Test Engineer</text>
    <text x="150" y="140" font-size="13.5" fill="#94a3b8">Transsion Manufacturing</text>
    <text x="150" y="164" font-size="12" fill="#94a3b8" opacity="0.85">QA · SDLC · 100+ bugs caught</text>
  </g>

  <!-- Stage 2 -->
  <g text-anchor="middle">
    <text x="500" y="46" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1.2">2024 to 2025</text>
    <circle cx="500" cy="72" r="10" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.8"/>
    <circle cx="500" cy="72" r="4.5" fill="#8b5cf6"/>
    <text x="500" y="118" font-size="16" font-weight="700" fill="#8b5cf6">System Administrator</text>
    <text x="500" y="140" font-size="13.5" fill="#94a3b8">Abronet PLC</text>
    <text x="500" y="164" font-size="12" fill="#94a3b8" opacity="0.85">Linux · Security · 99.9% uptime</text>
  </g>

  <!-- Stage 3, current -->
  <g text-anchor="middle">
    <text x="850" y="46" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="1.2">NOV 2025 TO NOW</text>
    <circle cx="850" cy="72" r="14" fill="#a78bfa" opacity="0.18"/>
    <circle cx="850" cy="72" r="10" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="850" cy="72" r="5.5" fill="#a78bfa"/>
    <text x="850" y="118" font-size="16" font-weight="700" fill="#8b5cf6">AI Specialist and Full-Stack Dev</text>
    <text x="850" y="140" font-size="13.5" fill="#94a3b8">Droga Consultancy</text>
    <text x="850" y="164" font-size="12" fill="#94a3b8" opacity="0.85">n8n · LangChain · Gemini · FastAPI</text>
  </g>
</svg>
