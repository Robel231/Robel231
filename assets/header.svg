<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img"
     aria-label="Robel Shemeles, AI Specialist and Full-Stack Developer at Droga Consultancy, Addis Ababa, Ethiopia. FastAPI, Go, Next.js, Flutter, n8n, Gemini.">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="290"/></clipPath>
    <clipPath id="skyclip"><path d="M0 0 H1000 V250 C 875 270, 625 230, 500 250 S 125 230, 0 250 Z"/></clipPath>
    <clipPath id="flag"><rect width="24" height="16" rx="3"/></clipPath>
    <style>
      .star { fill: #ffffff; animation: twinkle 3.6s ease-in-out infinite; }
      .s2 { animation-delay: 0.6s; } .s3 { animation-delay: 1.2s; }
      .s4 { animation-delay: 1.8s; } .s5 { animation-delay: 2.4s; } .s6 { animation-delay: 3s; }
      .pill { fill: #ffffff; fill-opacity: 0.07; stroke: #a78bfa; stroke-opacity: 0.45; stroke-width: 1; }
      .tag  { font-size: 13px; font-weight: 600; fill: #ddd6fe; }
      @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) { .star { animation: none; opacity: 0.5; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Night sky, ending in a wave -->
    <path d="M0 0 H1000 V250 C 875 270, 625 230, 500 250 S 125 230, 0 250 Z" fill="url(#sky)"/>
    <g clip-path="url(#skyclip)">
      <circle cx="140" cy="40" r="220" fill="url(#glowL)"/>
      <circle cx="880" cy="190" r="200" fill="url(#glowR)"/>
    </g>

    <!-- Stars -->
    <circle class="star"    cx="62"  cy="38"  r="1.4"/>
    <circle class="star s2" cx="118" cy="132" r="1"/>
    <circle class="star s3" cx="196" cy="62"  r="1.6"/>
    <circle class="star s4" cx="248" cy="196" r="1.1"/>
    <circle class="star s5" cx="304" cy="28"  r="1"/>
    <circle class="star s6" cx="232" cy="118" r="1.3"/>
    <circle class="star s3" cx="182" cy="226" r="1"/>
    <circle class="star s2" cx="612" cy="34"  r="1.2"/>
    <circle class="star s5" cx="792" cy="222" r="1.5"/>
    <circle class="star"    cx="760" cy="96"  r="1"/>
    <circle class="star s4" cx="782" cy="30"  r="1.6"/>
    <circle class="star s6" cx="836" cy="142" r="1.1"/>
    <circle class="star s2" cx="884" cy="58"  r="1.3"/>
    <circle class="star s3" cx="942" cy="176" r="1"/>
    <circle class="star s5" cx="966" cy="26"  r="1.4"/>
    <circle class="star s4" cx="28"  cy="196" r="1.2"/>

    <!-- Drifting edge line -->
    <g>
      <path d="M0 262 C 125 248, 375 276, 500 262 S 875 276, 1000 262 S 1375 276, 1500 262 S 1875 276, 2000 262"
            fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Location -->
  <g transform="translate(398 58)">
    <g clip-path="url(#flag)">
      <rect width="24" height="5.34" fill="#078930"/>
      <rect y="5.33" width="24" height="5.34" fill="#fcdd09"/>
      <rect y="10.66" width="24" height="5.34" fill="#da121a"/>
    </g>
    <text x="34" y="13" font-size="13" font-weight="600" fill="#c4b5fd" letter-spacing="3">ADDIS ABABA</text>
  </g>

  <text x="500" y="138" text-anchor="middle" font-size="60" font-weight="800" fill="url(#name)" letter-spacing="-1">Robel Shemeles</text>
  <text x="500" y="176" text-anchor="middle" font-size="18" fill="#c7d2fe">AI Specialist &amp; Full-Stack Developer · Droga Consultancy</text>

  <!-- Stack -->
  <g text-anchor="middle">
    <rect class="pill" x="282" y="196" width="77" height="28" rx="14"/><text class="tag" x="320.5" y="215">FastAPI</text>
    <rect class="pill" x="369" y="196" width="43" height="28" rx="14"/><text class="tag" x="390.5" y="215">Go</text>
    <rect class="pill" x="422" y="196" width="77" height="28" rx="14"/><text class="tag" x="460.5" y="215">Next.js</text>
    <rect class="pill" x="509" y="196" width="73" height="28" rx="14"/><text class="tag" x="545.5" y="215">Flutter</text>
    <rect class="pill" x="592" y="196" width="51" height="28" rx="14"/><text class="tag" x="617.5" y="215">n8n</text>
    <rect class="pill" x="653" y="196" width="69" height="28" rx="14"/><text class="tag" x="687.5" y="215">Gemini</text>
  </g>
</svg>
