<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img"
     aria-label="Agentic pipeline architecture. Clients (React, Next.js, Telegram, mobile) send requests to a secure FastAPI middleware layer, which calls n8n orchestration, which drives AI agents on Gemini and LangChain, which read and write PostgreSQL, Redis and Odoo ERP.">

  <text x="500" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="2.4">PRODUCTION AGENTIC PIPELINE</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" opacity="0.75"/>
    </marker>
    <style>
      .box  { fill: #8b5cf6; fill-opacity: 0.10; stroke: #8b5cf6; stroke-opacity: 0.55; stroke-width: 1.5; }
      .head { font-size: 15px; font-weight: 700; fill: #8b5cf6; }
      .sub  { font-size: 11.5px; fill: #94a3b8; }
      .flow { stroke: #8b5cf6; stroke-opacity: 0.75; stroke-width: 2; }
    </style>
  </defs>

  <g text-anchor="middle">
    <rect class="box" x="20"  y="46" width="165" height="94" rx="12"/>
    <text class="head" x="102.5" y="76">Clients</text>
    <text class="sub"  x="102.5" y="99">React · Next.js</text>
    <text class="sub"  x="102.5" y="117">Telegram · Mobile</text>

    <rect class="box" x="218" y="46" width="165" height="94" rx="12"/>
    <text class="head" x="300.5" y="76">FastAPI</text>
    <text class="sub"  x="300.5" y="99">Auth · Validation</text>
    <text class="sub"  x="300.5" y="117">Secure middleware</text>

    <rect class="box" x="416" y="46" width="165" height="94" rx="12"/>
    <text class="head" x="498.5" y="76">n8n</text>
    <text class="sub"  x="498.5" y="99">Orchestration</text>
    <text class="sub"  x="498.5" y="117">Queues · Retries</text>

    <rect class="box" x="614" y="46" width="165" height="94" rx="12"/>
    <text class="head" x="696.5" y="76">AI Agents</text>
    <text class="sub"  x="696.5" y="99">Gemini · LangChain</text>
    <text class="sub"  x="696.5" y="117">Shared memory</text>

    <rect class="box" x="812" y="46" width="165" height="94" rx="12"/>
    <text class="head" x="894.5" y="76">Data</text>
    <text class="sub"  x="894.5" y="99">PostgreSQL · Redis</text>
    <text class="sub"  x="894.5" y="117">Odoo ERP</text>
  </g>

  <line class="flow" x1="191" y1="93" x2="212" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="389" y1="93" x2="410" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="587" y1="93" x2="608" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="785" y1="93" x2="806" y2="93" marker-end="url(#arrow)"/>

  <text x="500" y="166" text-anchor="middle" font-size="11.5" fill="#94a3b8" opacity="0.85">Every hop is versioned, retried and observable</text>
</svg>
