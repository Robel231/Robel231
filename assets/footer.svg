<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img"
     aria-label="Thanks for visiting! Engineered in Addis Ababa, deployed to the world.">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24243e"/>
      <stop offset="45%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="150"/></clipPath>
    <clipPath id="flag"><rect width="21" height="14" rx="2.5"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <g>
      <path d="M0 28 C 125 42, 375 14, 500 28 S 875 14, 1000 28 S 1375 14, 1500 28 S 1875 14, 2000 28"
            fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <path d="M0 40 C 125 20, 375 60, 500 40 S 875 60, 1000 40 V150 H0 Z" fill="url(#sky)"/>
  </g>

  <text x="500" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#ddd6fe">Thanks for visiting!</text>
  <g transform="translate(326 112)">
    <g clip-path="url(#flag)">
      <rect width="21" height="4.67" fill="#078930"/>
      <rect y="4.66" width="21" height="4.68" fill="#fcdd09"/>
      <rect y="9.33" width="21" height="4.67" fill="#da121a"/>
    </g>
    <text x="31" y="12" font-size="13.5" fill="#a5b4fc">Engineered in Addis Ababa · Deployed to the world</text>
  </g>
</svg>
