<svg viewBox="0 0 1200 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base line -->
  <line x1="20" y1="14" x2="1180" y2="14" stroke="#808080" stroke-opacity="0.25" stroke-width="1"/>

  <!-- shimmer sweep -->
  <rect x="-220" y="12.5" width="220" height="3" rx="1.5" fill="url(#sweep)">
    <animate attributeName="x" values="-220;1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- spinning center diamond -->
  <g transform="translate(600 14)">
    <rect x="-5" y="-5" width="10" height="10" fill="#a78bfa">
      <animateTransform attributeName="transform" type="rotate" from="45 0 0" to="405 0 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="576" cy="14" r="2.5" fill="#6366f1"/>
  <circle cx="624" cy="14" r="2.5" fill="#6366f1"/>
</svg>
