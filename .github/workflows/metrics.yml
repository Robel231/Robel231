# Optional. Generates a stats card as a real SVG committed into this repo, so the
# profile never shows a broken image when a public badge service is rate limited.
#
# Setup:
#   1. Create a classic PAT with the "public_repo" scope (add "repo" if you want
#      private contributions counted).
#   2. Add it to this repo as the secret METRICS_TOKEN.
#   3. Replace the GitHub stats <picture> block in README.md with:
#      <img src="metrics.svg" width="100%" alt="GitHub metrics for Robel231"/>

name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Robel231
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Addis_Ababa
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
